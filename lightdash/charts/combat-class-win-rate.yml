chartConfig:
  config:
    eChartsConfig:
      series:
        - encode:
            xRef:
              field: fct_battle_units_unit_class
            yRef:
              field: fct_battle_units_class_battle_win_rate
          type: bar
      # The bars run top to bottom in the query's order, largest first.
      xAxis:
        - inverse: true
    layout:
      flipAxes: true
      xField: fct_battle_units_unit_class
      yField:
        - fct_battle_units_class_battle_win_rate
  type: cartesian
contentType: chart
description: >
  Share of decided battles won, counted once for each of the player's units in them, by the class the unit started
  the battle in. Classes with fewer than 500 decided battles are left out. A class that joins strong companies wins
  more, so read it with stage and difficulty.
metricQuery:
  additionalMetrics: []
  customDimensions: []
  dimensions:
    - fct_battle_units_unit_class
  exploreName: fct_battle_units
  filters:
    dimensions:
      and:
        - id: source
          operator: equals
          target:
            fieldId: fct_battle_units_source
          values:
            - simulated
      id: filters
    metrics:
      and:
        - id: enough-battles
          operator: greaterThanOrEqual
          target:
            fieldId: fct_battle_units_unit_battles_decided
          values:
            - 500
      id: metric-filters
  limit: 500
  metricOverrides:
    fct_battle_units_class_battle_win_rate:
      formatOptions:
        round: 1
        type: percent
  metrics:
    - fct_battle_units_class_battle_win_rate
    - fct_battle_units_unit_battles_decided
  sorts:
    - descending: true
      fieldId: fct_battle_units_class_battle_win_rate
  tableCalculations: []
name: Battle win rate by class
slug: combat-class-win-rate
spaceSlug: fellstrike
tableConfig:
  columnOrder:
    - fct_battle_units_unit_class
    - fct_battle_units_class_battle_win_rate
    - fct_battle_units_unit_battles_decided
tableName: fct_battle_units
version: 1
