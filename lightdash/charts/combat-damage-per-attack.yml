chartConfig:
  config:
    hideRowNumbers: true
    showTableNames: false
  type: table
contentType: chart
description: >
  Damage dealt per attack, by the attacker's side and class, for classes with at least 1,000 attacks. Every point
  of damage in a battle belongs to exactly one action.
metricQuery:
  additionalMetrics: []
  customDimensions: []
  dimensions:
    - fct_actions_actor_side
    - fct_actions_actor_class
  exploreName: fct_actions
  filters:
    dimensions:
      and:
        - id: source
          operator: equals
          target:
            fieldId: fct_actions_source
          values:
            - simulated
      id: filters
    metrics:
      and:
        - id: enough-attacks
          operator: greaterThanOrEqual
          target:
            fieldId: fct_actions_attacks
          values:
            - 1000
      id: metric-filters
  limit: 500
  metricOverrides:
    fct_actions_damage_per_attack:
      formatOptions:
        round: 2
        type: number
  metrics:
    - fct_actions_damage_per_attack
    - fct_actions_attacks
  sorts:
    - descending: true
      fieldId: fct_actions_damage_per_attack
  tableCalculations: []
name: Damage per attack by side and class
slug: combat-damage-per-attack
spaceSlug: fellstrike
tableConfig:
  columnOrder:
    - fct_actions_actor_side
    - fct_actions_actor_class
    - fct_actions_damage_per_attack
    - fct_actions_attacks
tableName: fct_actions
version: 1
