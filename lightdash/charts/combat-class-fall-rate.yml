chartConfig:
  config:
    eChartsConfig:
      series:
        - encode:
            xRef:
              field: fct_battle_units_unit_class
            yRef:
              field: fct_battle_units_unit_fall_rate
          type: bar
      # The bars run top to bottom in the query's order, largest first.
      xAxis:
        - inverse: true
    layout:
      flipAxes: true
      xField: fct_battle_units_unit_class
      yField:
        - fct_battle_units_unit_fall_rate
  type: cartesian
contentType: chart
description: >
  Share of a class's battles in which the unit fell, for the player's units on the field at the start. Classes with
  fewer than 500 battles are left out.
metricQuery:
  additionalMetrics: []
  customDimensions: []
  dimensions:
    - fct_battle_units_unit_class
  exploreName: fct_battle_units
  filters:
    dimensions:
      and:
        - id: source
          operator: equals
          target:
            fieldId: fct_battle_units_source
          values:
            - simulated
      id: filters
    metrics:
      and:
        - id: enough-battles
          operator: greaterThanOrEqual
          target:
            fieldId: fct_battle_units_unit_battles
          values:
            - 500
      id: metric-filters
  limit: 500
  metricOverrides:
    fct_battle_units_unit_fall_rate:
      formatOptions:
        round: 1
        type: percent
  metrics:
    - fct_battle_units_unit_fall_rate
    - fct_battle_units_unit_battles
  sorts:
    - descending: true
      fieldId: fct_battle_units_unit_fall_rate
  tableCalculations: []
name: Fall rate by class
slug: combat-class-fall-rate
spaceSlug: fellstrike
tableConfig:
  columnOrder:
    - fct_battle_units_unit_class
    - fct_battle_units_unit_fall_rate
    - fct_battle_units_unit_battles
tableName: fct_battle_units
version: 1
