chartConfig:
  config:
    eChartsConfig:
      series:
        - encode:
            xRef:
              field: fct_turns_run_turn
            yRef:
              field: fct_turns_median_turn_duration_s
          type: line
    layout:
      xField: fct_turns_run_turn
      yField:
        - fct_turns_median_turn_duration_s
  type: cartesian
contentType: chart
description: The median seconds on screen of each of a solo Endless run's first 10 player turns.
metricQuery:
  additionalMetrics: []
  customDimensions: []
  dimensions:
    - fct_turns_run_turn
  exploreName: fct_turns
  filters:
    dimensions:
      and:
        - id: source
          operator: equals
          target:
            fieldId: fct_turns_source
          values:
            - simulated
        - id: mode
          operator: equals
          target:
            fieldId: fct_turns_mode
          values:
            - endless
        - id: first-ten
          operator: lessThanOrEqual
          target:
            fieldId: fct_turns_run_turn
          values:
            - 10
      id: filters
  limit: 500
  metricOverrides:
    fct_turns_median_turn_duration_s:
      formatOptions:
        round: 1
        type: number
  metrics:
    - fct_turns_median_turn_duration_s
  sorts:
    - descending: false
      fieldId: fct_turns_run_turn
  tableCalculations: []
name: Turn length across the first 10 run turns
slug: endless-turn-seconds-by-run-turn
spaceSlug: fellstrike
tableConfig:
  columnOrder:
    - fct_turns_run_turn
    - fct_turns_median_turn_duration_s
tableName: fct_turns
version: 1
