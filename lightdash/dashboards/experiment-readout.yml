      content: |
        **The readout comes first,** as the plan (docs/experiment-endless-opening.md) sets it. Its primary metric is
        each player's share of empty opening turns in their first run. If the sample ratio's chi-square is above 10.83,
        the split is broken and nothing can be trusted. Values stay empty until the plan's end date is in the data.
        Real and simulated rows sit side by side and are never added together.

        **Today** the A/A test (`endless_opening_aa`) reads as it should, with no clear difference on any metric. The
        real experiment (`endless_opening_v1`) waits for its change and its dates.
