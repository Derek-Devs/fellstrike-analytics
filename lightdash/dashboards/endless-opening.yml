      content: >
        **Simulated data,** solo Endless runs only. The opening is a run's first 5 player turns. An **early quit** is
        a run abandoned or dropped in the opening. A run lost in the opening is not a quit, so the two rates at the top
        don't add up to 100%. An **empty turn** is one where none of the player's units could reach a foe or a hurt
        ally.
